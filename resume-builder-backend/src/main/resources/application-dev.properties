# ===============================
# Development Profile
# ===============================


# MongoDB (safe fallback for Docker/local)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/resume-builder}
spring.data.mongodb.database=${MONGODB_DATABASE:resume-builder}


# JWT (safe fallback for dev, override in prod)
jwt.secret=${JWT_SECRET:dev-secret-change-me-to-something-longer-for-256-bits}


# Frontend / Backend (safe fallback for local dev)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.backend.url=${BACKEND_URL:http://localhost:8080}


# CORS (prefer explicit override, then frontend URL, then local dev URLs)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:3000,http://localhost:5173,http://localhost:5174}}


# SendGrid (use fake/dev credentials or override in .env)
sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:${EMAIL_USERNAME:noreply@resumebuilder.local}}

# Cloudinary (image uploads)
cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}

# AI CV Reviewer (OpenAI or Gemini)
ai.openai.api-key=${OPENAI_API_KEY}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.gemini.api-key=${GEMINI_API_KEY}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Debug logging
logging.level.com.sasindu.rdsumebuilder=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Error visibility (DEV ONLY)
server.error.include-message=always
server.error.include-stacktrace=always

# Actuator (DEV ONLY)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
