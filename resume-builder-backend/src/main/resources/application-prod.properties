# ===============================
# Production Profile
# ===============================


# MongoDB (safe fallback for Docker/local)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/resume-builder}
spring.data.mongodb.database=${MONGODB_DATABASE:resume-builder}


# JWT (safe fallback for dev, override in prod)
jwt.secret=${JWT_SECRET:dev-secret-change-me}


# SendGrid (safe fallback for dev, override in prod)
sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:${EMAIL_USERNAME:noreply@resumebuilder.com}}


# Cloudinary (safe fallback: empty disables cloud uploads)
cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api.key=${CLOUDINARY_API_KEY:}
cloudinary.api.secret=${CLOUDINARY_API_SECRET:}

# AI CV Reviewer (OpenAI or Gemini)
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}


# Frontend (safe fallback for local dev)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}


# CORS (prefer explicit override, then frontend URL, then local dev URLs)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173,http://localhost:5174}}

# Logging
logging.level.root=WARN
logging.level.com.sasindu.rdsumebuilder=INFO
logging.level.org.springframework=WARN

# Error hiding
server.error.include-message=never
server.error.include-stacktrace=never

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Performance
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
