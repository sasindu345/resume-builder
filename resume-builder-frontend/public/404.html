<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resume Builder</title>
    <script>
      ;(function () {
        var redirectPath = window.location.pathname + window.location.search + window.location.hash
        var base = window.location.pathname.split('/').slice(0, -1).join('/') + '/'
        window.location.replace(base + '?' + encodeURIComponent(redirectPath))
      })()
    </script>
  </head>
  <body></body>
</html>
